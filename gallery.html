<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Rakhi Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .page-head{max-width:1040px;margin:0 auto;padding:20px 20px 10px;text-align:center;}
  .page-head h1{font-size:clamp(28px,5vw,40px);}
  .page-head p{max-width:460px;margin:0 auto;}
  .grid{
    max-width:1040px;margin:40px auto 80px;padding:0 20px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  }
  @media(max-width:800px){.grid{grid-template-columns:1fr;max-width:420px;}}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;
    box-shadow:0 18px 40px -24px rgba(92,17,41,0.3);text-align:center;
  }
  .card canvas{width:100%;border-radius:12px;}
  .card h3{font-family:'Fraunces',serif;font-size:16px;margin:14px 0 4px;color:var(--maroon-deep);}
  .card p{font-size:12.5px;color:#9a8a7a;margin:0 0 14px;}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="brand" href="index.html"><span class="thread-dot"></span>Rakhi Memory</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="gallery.html" class="active">Gallery</a>
    <a href="about.html">About</a>
    <a href="app.html" class="nav-cta">Create yours</a>
  </div>
</nav>

<section class="page-head">
  <span class="eyebrow">Designs</span>
  <h1>Three ways to tie the thread</h1>
  <p class="sub">Every design uses your own names and photo — these are just samples so you can see the feel of each.</p>
</section>

<div class="grid" id="grid"></div>

<footer class="site-footer">
  <p>Made with 🧵 for Raksha Bandhan · <a href="index.html">Home</a> · <a href="about.html">About</a></p>
</footer>

<script src="js/cardRenderer.js"></script>
<script>
  const samples = [
    {key:'gold', sender:'Priya', sibling:'Rohan', relation:'Brother'},
    {key:'maroon', sender:'Ananya', sibling:'Meera', relation:'Sister'},
    {key:'ivory', sender:'Karan', sibling:'Aisha', relation:'Sister'},
  ];
  const grid = document.getElementById('grid');
  samples.forEach((s)=>{
    const t = TEMPLATES[s.key];
    const wrap = document.createElement('div');
    wrap.className = 'card';
    wrap.innerHTML = `<canvas width="1080" height="1350"></canvas><h3>${t.label}</h3><p>Sample preview</p>`;
    grid.appendChild(wrap);
    const canvas = wrap.querySelector('canvas');
    renderRakhiCard(canvas, {templateKey:s.key, sender:s.sender, sibling:s.sibling, relation:s.relation, photoDataUrl:null});
  });
</script>
</body>
</html>
